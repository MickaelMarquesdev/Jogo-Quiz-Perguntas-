<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de perguntas</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Baloo+2:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="quiz">
        <p class="progresso">Pergunta 1 de 10</p>
        <div class="barra-progresso">
            <div class="barra-progresso-preenchida"></div>
        </div>
        <h2 class="pergunta">Carregando...</h2>

        <div class="alternativas">

        </div>
    </div>


    <div class="resultado">

        <h2>Quiz finalizado</h2>
        <p class="mensagem-resultado"></p>
        <p class="pontuacao-final"></p>
        <button class="btn-jogar-novamente">Jogar Novamente</button>

    </div>

    <script src="script.js"></script>
</body>

</html>
